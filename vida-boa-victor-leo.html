<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vida Boa – Victor & Leo</title>
  <link href="https://fonts.googleapis.com/css2?family=Kaushan+Script&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 100vw; height: 100vh;
      overflow: hidden;
      background: #1a6ab1;
      font-family: 'Nunito', sans-serif;
      user-select: none;
    }

    #scene { position: absolute; width: 100%; height: 100%; }

    /* ──── START SCREEN ──── */
    #start-screen {
      position: fixed; inset: 0; z-index: 100;
      display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(4px);
    }
    .start-card {
      background: linear-gradient(145deg, #fffde7, #fff9c4);
      border-radius: 24px;
      padding: 48px 56px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
      animation: card-in 0.6s ease;
    }
    @keyframes card-in {
      from { transform: scale(0.7) translateY(30px); opacity: 0; }
      to   { transform: scale(1)   translateY(0);    opacity: 1; }
    }
    .start-card .note { font-size: 56px; margin-bottom: 8px; }
    .start-card h2 {
      font-family: 'Kaushan Script', cursive;
      font-size: 42px; color: #e65100;
      text-shadow: 1px 2px 4px rgba(0,0,0,0.15);
    }
    .start-card p { font-size: 18px; color: #5d4037; margin-top: 4px; }
    #start-btn {
      margin-top: 28px;
      background: linear-gradient(135deg, #ff8f00, #e65100);
      color: white; border: none; border-radius: 50px;
      padding: 14px 44px; font-size: 20px; font-weight: 700;
      cursor: pointer; letter-spacing: 0.05em;
      box-shadow: 0 6px 20px rgba(230,81,0,0.45);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    #start-btn:hover {
      transform: scale(1.06);
      box-shadow: 0 8px 28px rgba(230,81,0,0.55);
    }

    /* ──── SUN ──── */
    @keyframes rotate-rays {
      from { transform: rotate(0deg);   }
      to   { transform: rotate(360deg); }
    }
    @keyframes pulse-sun {
      0%,100% { opacity: 1;    }
      50%      { opacity: 0.85; }
    }
    .sun-rays {
      transform-origin: 830px 105px;
      animation: rotate-rays 18s linear infinite;
    }
    .sun-core { animation: pulse-sun 2.5s ease-in-out infinite; }

    /* ──── CLOUDS ──── */
    @keyframes drift1 {
      0%   { transform: translateX(-260px); }
      100% { transform: translateX(1260px); }
    }
    @keyframes drift2 {
      0%   { transform: translateX(-340px); }
      100% { transform: translateX(1340px); }
    }
    .cloud-a { animation: drift1 38s linear infinite; }
    .cloud-b { animation: drift2 54s linear infinite 18s; }

    /* ──── BIRDS ──── */
    @keyframes fly {
      0%   { transform: translate(-130px,  0);    }
      30%  { transform: translate(300px,  -28px); }
      65%  { transform: translate(660px,    4px); }
      100% { transform: translate(1130px, -12px); }
    }
    .birds { animation: fly 26s linear infinite 5s; }

    /* ──── FROG ──── */
    @keyframes hop {
      0%,45%,100% { transform: translateY(0)    scaleY(1)    scaleX(1); }
      20%          { transform: translateY(-30px) scaleY(0.82) scaleX(1.12); }
    }
    .frog { animation: hop 2.8s ease-in-out infinite; transform-origin: 295px 510px; }

    /* ──── WATER ──── */
    @keyframes ripple {
      0%   { transform: scale(0.5); opacity: 0.75; }
      100% { transform: scale(1.5); opacity: 0;    }
    }
    .rpl  { animation: ripple 2.2s ease-out infinite;       transform-origin: 360px 528px; }
    .rpl2 { animation: ripple 2.2s ease-out infinite 1.1s;  transform-origin: 360px 528px; }

    /* ──── FLOWERS ──── */
    @keyframes sway {
      0%,100% { transform: rotate(-7deg); }
      50%      { transform: rotate(7deg);  }
    }
    .fl { animation: sway 2.4s ease-in-out infinite; }

    /* ──── SMOKE ──── */
    @keyframes smoke {
      0%   { transform: translateY(0)    scale(0.7); opacity: 0.55; }
      100% { transform: translateY(-75px) scale(2);  opacity: 0;    }
    }
    .smk { animation: smoke 3.4s ease-out infinite; }

    /* ──── BUTTERFLY ──── */
    @keyframes flutter {
      0%,100% { transform: scaleX(1);   }
      50%      { transform: scaleX(0.2); }
    }
    @keyframes flutter-path {
      0%   { transform: translate(430px,430px) rotate(0deg);  }
      25%  { transform: translate(485px,404px) rotate(12deg); }
      50%  { transform: translate(515px,422px) rotate(-6deg); }
      75%  { transform: translate(462px,444px) rotate(9deg);  }
      100% { transform: translate(430px,430px) rotate(0deg);  }
    }
    .bf-body   { animation: flutter-path 6s ease-in-out infinite; }
    .bf-wings  { animation: flutter 0.28s ease-in-out infinite; }

    /* ──── RAINBOW ──── */
    @keyframes rainbow-show {
      0%,55%  { opacity: 0;    }
      68%,88% { opacity: 0.52; }
      100%    { opacity: 0;    }
    }
    .rainbow { animation: rainbow-show 16s ease-in-out infinite 3s; }

    /* ──── DOG TAIL WAG ──── */
    @keyframes wag {
      0%,100% { transform: rotate(-25deg); }
      50%      { transform: rotate(25deg);  }
    }
    .dog-tail { animation: wag 0.55s ease-in-out infinite; transform-origin: 467px 488px; }

    /* ──── STARS ──── */
    @keyframes twinkle {
      0%,100% { opacity: 0.15; }
      50%      { opacity: 0.8;  }
    }
    .star { animation: twinkle 2s ease-in-out infinite; }

    /* ════════════════════════
       LYRICS
    ════════════════════════ */
    #lyrics-wrap {
      position: absolute; bottom: 0; width: 100%; height: 48%;
      display: flex; flex-direction: column;
      align-items: center; justify-content: flex-end;
      padding-bottom: 58px;
      pointer-events: none;
    }
    #lyric-line {
      font-family: 'Kaushan Script', cursive;
      font-size: clamp(26px, 4.6vw, 54px);
      color: #fff;
      text-shadow:
        2px  2px 0   rgba(0,0,0,0.45),
        0    0   20px rgba(0,0,0,0.28),
        0    0   44px rgba(255,200,50,0.2);
      text-align: center;
      padding: 0 28px; max-width: 920px;
      opacity: 0; transform: translateY(14px);
      transition: opacity 0.45s ease, transform 0.45s ease;
      line-height: 1.35;
    }
    #lyric-line.on  { opacity: 1; transform: translateY(0); }
    #lyric-line.chorus {
      color: #ffe57f;
      font-size: clamp(30px, 5.6vw, 64px);
      text-shadow:
        2px  2px 0   rgba(0,0,0,0.5),
        0    0   24px rgba(255,160,0,0.65),
        0    0   55px rgba(255,160,0,0.28);
    }

    /* ──── PROGRESS ──── */
    #prog-bar {
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
      width: 56%; height: 5px;
      background: rgba(255,255,255,0.22); border-radius: 3px;
    }
    #prog-fill {
      height: 100%;
      background: linear-gradient(90deg, #ffe57f, #ff8f00);
      border-radius: 3px; width: 0%;
      transition: width 0.4s linear;
    }

    /* ──── TITLE ──── */
    #title {
      position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
      text-align: center; color: white;
      text-shadow: 1px 2px 6px rgba(0,0,0,0.38);
      white-space: nowrap;
    }
    #title h1 {
      font-family: 'Kaushan Script', cursive;
      font-size: clamp(22px, 3.6vw, 46px);
    }
    #title p {
      font-size: clamp(12px, 1.7vw, 19px);
      opacity: 0.88; margin-top: 2px; letter-spacing: 0.05em;
    }

    /* ──── PLAY/PAUSE FLASH ──── */
    #pip {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%,-50%) scale(0);
      font-size: 72px; opacity: 0; pointer-events: none;
      transition: opacity 0.22s, transform 0.22s;
    }
    #pip.show { opacity: 0.75; transform: translate(-50%,-50%) scale(1); }

    /* ──── HINT ──── */
    #hint {
      position: absolute; bottom: 34px; right: 20px;
      color: rgba(255,255,255,0.48); font-size: 11px;
      letter-spacing: 0.04em;
    }

    /* ──── VOLUME BADGE ──── */
    #vol-badge {
      position: absolute; top: 20px; right: 20px;
      color: rgba(255,255,255,0.7); font-size: 20px; cursor: pointer;
      transition: opacity 0.2s;
    }
    #vol-badge:hover { opacity: 0.5; }
  </style>
</head>
<body>

<!-- ═══════════════════════════════════════
     START SCREEN
════════════════════════════════════════ -->
<div id="start-screen">
  <div class="start-card">
    <div class="note">🌿🎵🐸</div>
    <h2>Vida Boa</h2>
    <p>Victor &amp; Leo</p>
    <button id="start-btn">▶ Começar</button>
  </div>
</div>

<!-- ═══════════════════════════════════════
     SCENE SVG
════════════════════════════════════════ -->

  <defs>

      <stop offset="0%"   stop-color="#5aad3f"/>

    <radialGradient id="sun-g" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#fff9c4"/>
      <stop offset="60%"  stop-color="#ffca28"/>
      <stop offset="100%" stop-color="#ff8f00" stop-opacity="0"/>

    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#5bc8f5"/>
      <stop offset="100%" stop-color="#0277bd"/>
    </linearGradient>
    <linearGradient id="h1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#6ec94e"/>
      <stop offset="100%" stop-color="#3e8c22"/>
    </linearGradient>
    <linearGradient id="h2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#58b838"/>
      <stop offset="100%" stop-color="#2d7216"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="1000" height="600" fill="url(#sky)"/>

  <!-- Stars -->

  <circle class="star" cx="505" cy="38"  r="1"   fill="white" style="animation-delay:.4s"/>
  <circle class="star" cx="620" cy="18"  r="1.5" fill="white" style="animation-delay:1.1s"/>

    <path d="M180 420 Q350 208 520 420" stroke="#9c27b0" stroke-width="7" fill="none" opacity=".62"/>
  </g>

  <!-- Sun glow -->

  <!-- Sun rays -->

    <line x1="830" y1="18"  x2="830" y2="0"   stroke="#ffd740" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="830" y1="210" x2="830" y2="228"  stroke="#ffd740" stroke-width="4.5" stroke-linecap="round"/>

    <line x1="767" y1="43"  x2="753" y2="29"   stroke="#ffd740" stroke-width="3.5" stroke-linecap="round"/>

    <line x1="893" y1="167" x2="907" y2="181"  stroke="#ffd740" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Sun disc -->

  <!-- Sun face -->
  <circle cx="814" cy="98" r="6"  fill="#ff8f00"/>
  <circle cx="846" cy="98" r="6"  fill="#ff8f00"/>
  <circle cx="815" cy="97" r="3"  fill="#5d4037"/>
  <circle cx="847" cy="97" r="3"  fill="#5d4037"/>
  <path d="M816 113 Q830 123 844 113" stroke="#e65100" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Clouds -->
  <g class="cloud-a">
    <ellipse cx="160" cy="94"  rx="86"  ry="36" fill="white" opacity=".92"/>
    <ellipse cx="114" cy="106" rx="53"  ry="30" fill="white" opacity=".92"/>

    <ellipse cx="160" cy="112" rx="76"  ry="22" fill="white" opacity=".92"/>
  </g>
  <g class="cloud-b">

  <!-- Frog -->
  <g class="frog">
    <ellipse cx="295" cy="512" rx="26" ry="7" fill="rgba(0,0,0,.18)"/>

<div id="hint">clique para pausar / retomar</div>

<script>
/* ═══════════════════════════════════════════
   LETRAS  — ajuste se necessário
═══════════════════════════════════════════ */
const lyrics = [
  { t:"♪ ♪ ♪",                            d:2600, c:false },
  { t:"Moro num lugar",                    d:3100, c:false },
  { t:"Numa casinha inocente do sertão",   d:3900, c:false },
  { t:"Com um pé de laranja lima",         d:3200, c:false },
  { t:"Um cachorrinho fiel de companhão",  d:3900, c:false },
  { t:"Minha vida é muito simples",        d:3200, c:false },
  { t:"Mas de graça eu não a troco não",   d:3900, c:false },
  { t:"Pois eu tenho o que é mais precioso", d:3200, c:false },
  { t:"Que é saúde e um bom coração",      d:3900, c:false },
  { t:"♪",                                 d:1900, c:false },
  { t:"Que vida boa, ô ô ô",               d:3300, c:true  },
  { t:"Que vida boa",                      d:2800, c:true  },
  { t:"Sapo caiu na lagoa",                d:3300, c:true  },
  { t:"Sou eu no caminho do meu sertão",   d:4400, c:true  },
  { t:"Que vida boa, ô ô ô",               d:3300, c:true  },
  { t:"Que vida boa",                      d:2800, c:true  },
  { t:"Sapo caiu na lagoa",                d:3300, c:true  },
  { t:"Sou eu no caminho do meu sertão",   d:4400, c:true  },
  { t:"♪",                                 d:1900, c:false },
  { t:"Tenho o sol da madrugada",          d:3200, c:false },
  { t:"Tenho o brilho da manhã",           d:3200, c:false },
  { t:"Tenho a chuva que molha a terra",   d:3200, c:false },
  { t:"E o arco-íris que vem lá",          d:3600, c:false },
  { t:"Os pássaros cantando na varanda",   d:3200, c:false },
  { t:"A borboleta voando pelo ar",        d:3600, c:false },
  { t:"♪",                                 d:1900, c:false },
  { t:"Que vida boa, ô ô ô",               d:3300, c:true  },
  { t:"Que vida boa",                      d:2800, c:true  },
  { t:"Sapo caiu na lagoa",                d:3300, c:true  },
  { t:"Sou eu no caminho do meu sertão",   d:4400, c:true  },
  { t:"Que vida boa, ô ô ô",               d:3300, c:true  },
  { t:"Que vida boa",                      d:2800, c:true  },
  { t:"Sapo caiu na lagoa",                d:3300, c:true  },
  { t:"Sou eu no caminho do meu sertão",   d:4800, c:true  },
  { t:"🎵  Vida Boa  🎵",                  d:5000, c:true  },
];

/* ═══════════════════════════════════════════
   WEB AUDIO — melodia sertaneja sintética
═══════════════════════════════════════════ */
const F = {
  G2:98, A2:110, B2:123,
  C3:131, D3:147, E3:165, G3:196, A3:220, B3:247,
  C4:262, D4:294, E4:330, G4:392, A4:440, B4:494,
  C5:523, D5:587, E5:659, G5:784
};

const BPM  = 116;
const B    = 60 / BPM;          // beat duration in seconds
const BARS = 8;
const LOOP = BARS * 4 * B;      // total loop duration

/* Melody: [freq, beats] */
const MEL = [
  [F.G4,1],[F.B4,.5],[F.D5,.5],[F.E5,1],[F.D5,1],
  [F.B4,2],[F.G4,2],
  [F.A4,1],[F.G4,.5],[F.A4,.5],[F.B4,1],[F.A4,1],
  [F.G4,4],
  [F.D5,.5],[F.E5,.5],[F.G5,1],[F.E5,1],[F.D5,1],
  [F.B4,1.5],[F.A4,.5],[F.G4,2],
  [F.A4,.5],[F.B4,.5],[F.D5,1],[F.B4,1],[F.G4,1],
  [F.D4,2],[F.G4,2],
];

/* Bass: [freq, beats] — root-fifth per 2 beats */
const BASS = [
  [F.G2,2],[F.D3,2],
  [F.C3,2],[F.G3,2],
  [F.D3,2],[F.A3,2],
  [F.G2,4],
  [F.G2,2],[F.D3,2],
  [F.C3,2],[F.G3,2],
  [F.D3,2],[F.A3,2],
  [F.G2,4],
];

let actx = null;
let muted = false;
let masterGain = null;

function initAudio() {
  actx = new (window.AudioContext || window.webkitAudioContext)();
  masterGain = actx.createGain();
  masterGain.gain.value = 0.7;
  masterGain.connect(actx.destination);
  scheduleLoop(actx.currentTime + 0.1);
}

function scheduleLoop(t0) {
  schedMelody(t0);
  schedBass(t0);
  schedPercussion(t0);
  const ahead = (t0 - actx.currentTime + LOOP - 0.6) * 1000;
  setTimeout(() => scheduleLoop(t0 + LOOP), Math.max(0, ahead));
}

function schedMelody(t0) {
  let t = t0;
  for (const [freq, beats] of MEL) {
    const dur = beats * B;
    playNote(freq, t, dur * 0.88, 0.38, 'triangle');
    t += dur;
  }
}

function schedBass(t0) {
  let t = t0;
  for (const [freq, beats] of BASS) {
    const dur = beats * B;
    playNote(freq, t, dur * 0.82, 0.32, 'sine');
    t += dur;
  }
}

function schedPercussion(t0) {
  const totalBeats = BARS * 4;
  for (let i = 0; i < totalBeats; i++) {
    const t = t0 + i * B;
    const beat = i % 4;
    if (beat === 0 || beat === 2) playKick(t);
    if (beat === 1 || beat === 3) playSnare(t);
    playHat(t);
    playHat(t + B * 0.5);
  }
}

function playNote(freq, start, dur, vol, type) {
  const osc  = actx.createOscillator();
  const gain = actx.createGain();
  const flt  = actx.createBiquadFilter();
  flt.type = 'lowpass';
  flt.frequency.value = 3000;
  osc.type = type;
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(0, start);
  gain.gain.linearRampToValueAtTime(vol, start + 0.025);
  gain.gain.setValueAtTime(vol * 0.75, start + dur * 0.55);
  gain.gain.exponentialRampToValueAtTime(0.001, start + dur);
  osc.connect(flt); flt.connect(gain); gain.connect(masterGain);
  osc.start(start); osc.stop(start + dur + 0.05);
}

function playKick(t) {
  const osc  = actx.createOscillator();
  const gain = actx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(155, t);
  osc.frequency.exponentialRampToValueAtTime(48, t + 0.18);
  gain.gain.setValueAtTime(0.55, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + 0.28);
  osc.connect(gain); gain.connect(masterGain);
  osc.start(t); osc.stop(t + 0.32);
}

function noise(dur) {
  const n   = Math.ceil(actx.sampleRate * dur);
  const buf = actx.createBuffer(1, n, actx.sampleRate);
  const d   = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  const src = actx.createBufferSource();
  src.buffer = buf;
  return src;
}

function playSnare(t) {
  const src  = noise(0.18);
  const flt  = actx.createBiquadFilter();
  flt.type = 'bandpass'; flt.frequency.value = 1600; flt.Q.value = 0.5;
  const gain = actx.createGain();
  gain.gain.setValueAtTime(0.28, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + 0.16);
  src.connect(flt); flt.connect(gain); gain.connect(masterGain);
  src.start(t); src.stop(t + 0.2);
}

function playHat(t) {
  const src  = noise(0.06);
  const flt  = actx.createBiquadFilter();
  flt.type = 'highpass'; flt.frequency.value = 7200;
  const gain = actx.createGain();
  gain.gain.setValueAtTime(0.07, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + 0.055);
  src.connect(flt); flt.connect(gain); gain.connect(masterGain);
  src.start(t); src.stop(t + 0.07);
}

/* ═══════════════════════════════════════════
   LYRICS ENGINE
═══════════════════════════════════════════ */
const lineEl   = document.getElementById('lyric-line');
const progFill = document.getElementById('prog-fill');
const pip      = document.getElementById('pip');

const totalMs  = lyrics.reduce((s, l) => s + l.d, 0);
let idx     = 0;
let elapsed = 0;
let playing = false;
let tid     = null;

function showLyric(i) {
  if (i >= lyrics.length) { elapsed = 0; idx = 0; showLyric(0); return; }
  const item = lyrics[i];
  lineEl.classList.remove('on','chorus');
  void lineEl.offsetWidth; // reflow to restart transition
  setTimeout(() => {
    lineEl.textContent = item.t;
    if (item.c) lineEl.classList.add('chorus');
    lineEl.classList.add('on');
    tid = setTimeout(() => {
      elapsed += item.d; idx++;
      progFill.style.width = Math.min(elapsed / totalMs * 100, 100) + '%';
      showLyric(idx);
    }, item.d);
  }, 300);
}

function pauseResume() {
  if (!playing) return;
  if (tid) {
    clearTimeout(tid); tid = null;
    lineEl.classList.remove('on');
    pip.textContent = '▶'; pip.classList.add('show');
    playing = false;
  } else {
    playing = true;
    pip.textContent = '⏸'; pip.classList.add('show');
    showLyric(idx);
  }
  clearTimeout(pip._t);
  pip._t = setTimeout(() => pip.classList.remove('show'), 900);
}

/* ═══════════════════════════════════════════
   START
═══════════════════════════════════════════ */
document.getElementById('start-btn').addEventListener('click', () => {
  document.getElementById('start-screen').style.display = 'none';
  initAudio();
  playing = true;
  setTimeout(() => showLyric(0), 600);
});

document.body.addEventListener('click', (e) => {
  if (e.target.closest('#start-screen') ||
      e.target.closest('#vol-badge')) return;
  pauseResume();
});

/* Volume toggle */
const volBadge = document.getElementById('vol-badge');
volBadge.addEventListener('click', () => {
  if (!actx) return;
  muted = !muted;
  masterGain.gain.value = muted ? 0 : 0.7;
  volBadge.textContent = muted ? '🔇' : '🔊';
});
</script>
