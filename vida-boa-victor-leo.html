<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vida Boa – Victor & Leo</title>
  <link href="https://fonts.googleapis.com/css2?family=Kaushan+Script&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #1a6ab1;
      font-family: 'Nunito', sans-serif;
      cursor: pointer;
      user-select: none;
    }

    #scene {
      position: absolute;
      width: 100%;
      height: 100%;
    }

    /* ── Sun ── */
    @keyframes rotate-rays {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }
    @keyframes pulse-sun {
      0%,100% { r: 52; }
      50%      { r: 56; }
    }
    .sun-rays {
      transform-origin: 830px 105px;
      animation: rotate-rays 18s linear infinite;
    }
    .sun-glow {
      animation: pulse-sun 3s ease-in-out infinite;
    }

    /* ── Clouds ── */
    @keyframes drift1 {
      0%   { transform: translateX(-250px); }
      100% { transform: translateX(1250px); }
    }
    @keyframes drift2 {
      0%   { transform: translateX(-350px); }
      100% { transform: translateX(1350px); }
    }
    .cloud-a { animation: drift1 40s linear infinite; }
    .cloud-b { animation: drift2 55s linear infinite 20s; }

    /* ── Birds ── */
    @keyframes fly {
      0%   { transform: translate(-120px,  0px); }
      30%  { transform: translate(300px,  -25px); }
      60%  { transform: translate(650px,   5px); }
      100% { transform: translate(1120px, -10px); }
    }
    .birds { animation: fly 28s linear infinite 6s; }

    /* ── Frog ── */
    @keyframes hop {
      0%,45%,100% { transform: translateY(0)   scaleY(1)   scaleX(1); }
      20%          { transform: translateY(-28px) scaleY(0.85) scaleX(1.1); }
    }
    .frog { animation: hop 2.8s ease-in-out infinite; transform-origin: 295px 510px; }

    /* ── Water ripple ── */
    @keyframes ripple {
      0%   { transform: scale(0.6); opacity: 0.7; }
      100% { transform: scale(1.4); opacity: 0; }
    }
    .rpl { animation: ripple 2.4s ease-out infinite; transform-origin: 360px 528px; }
    .rpl2 { animation: ripple 2.4s ease-out infinite 1.2s; transform-origin: 360px 528px; }

    /* ── Flowers ── */
    @keyframes sway {
      0%,100% { transform: rotate(-6deg); }
      50%      { transform: rotate(6deg); }
    }
    .fl { animation: sway 2.2s ease-in-out infinite; }

    /* ── Smoke ── */
    @keyframes smoke {
      0%   { transform: translateY(0)    scale(0.8); opacity: 0.5; }
      100% { transform: translateY(-70px) scale(1.8); opacity: 0; }
    }
    .smk { animation: smoke 3.5s ease-out infinite; }

    /* ── Stars (twinkling at top) ── */
    @keyframes twinkle {
      0%,100% { opacity: 0.2; }
      50%      { opacity: 0.9; }
    }
    .star { animation: twinkle 2s ease-in-out infinite; }

    /* ── Butterfly ── */
    @keyframes flutter {
      0%,100% { transform: scaleX(1); }
      50%      { transform: scaleX(0.3); }
    }
    @keyframes butterfly-path {
      0%   { transform: translate(430px, 430px) rotate(0deg); }
      25%  { transform: translate(480px, 405px) rotate(10deg); }
      50%  { transform: translate(510px, 420px) rotate(-5deg); }
      75%  { transform: translate(465px, 440px) rotate(8deg); }
      100% { transform: translate(430px, 430px) rotate(0deg); }
    }
    .butterfly-body { animation: butterfly-path 6s ease-in-out infinite; }
    .butterfly-wings { animation: flutter 0.3s ease-in-out infinite; }

    /* ── Rainbow ── */
    @keyframes rainbow-show {
      0%,60%  { opacity: 0; }
      70%,90% { opacity: 0.55; }
      100%    { opacity: 0; }
    }
    .rainbow { animation: rainbow-show 14s ease-in-out infinite 4s; }

    /* ──────────────────────────────────────
       LYRICS
    ────────────────────────────────────── */
    #lyrics-wrap {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 48%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding-bottom: 56px;
      pointer-events: none;
    }

    #lyric-line {
      font-family: 'Kaushan Script', cursive;
      font-size: clamp(26px, 4.5vw, 52px);
      color: #fff;
      text-shadow:
        2px  2px 0   rgba(0,0,0,0.45),
        0    0   18px rgba(0,0,0,0.3),
        0    0   40px rgba(255,200,50,0.25);
      text-align: center;
      padding: 0 24px;
      max-width: 900px;
      opacity: 0;
      transform: translateY(12px);
      transition: opacity 0.5s ease, transform 0.5s ease;
      line-height: 1.35;
    }
    #lyric-line.on {
      opacity: 1;
      transform: translateY(0);
    }

    /* chorus highlight */
    #lyric-line.chorus {
      color: #ffe57f;
      text-shadow:
        2px  2px 0   rgba(0,0,0,0.5),
        0    0   22px rgba(255,160,0,0.6),
        0    0   50px rgba(255,160,0,0.3);
      font-size: clamp(30px, 5.5vw, 62px);
    }

    /* ── Progress ── */
    #prog-bar {
      position: absolute;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      width: 58%;
      height: 5px;
      background: rgba(255,255,255,0.25);
      border-radius: 3px;
    }
    #prog-fill {
      height: 100%;
      background: linear-gradient(90deg, #ffe57f, #ff8f00);
      border-radius: 3px;
      width: 0%;
      transition: width 0.4s linear;
    }

    /* ── Title ── */
    #title {
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      color: white;
      text-shadow: 1px 2px 6px rgba(0,0,0,0.4);
      white-space: nowrap;
    }
    #title h1 {
      font-family: 'Kaushan Script', cursive;
      font-size: clamp(22px, 3.5vw, 44px);
    }
    #title p {
      font-size: clamp(12px, 1.6vw, 18px);
      opacity: 0.88;
      margin-top: 2px;
      letter-spacing: 0.05em;
    }

    /* ── Play/Pause flash ── */
    #pip {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%,-50%) scale(0);
      font-size: 72px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s, transform 0.25s;
    }
    #pip.show {
      opacity: 0.75;
      transform: translate(-50%,-50%) scale(1);
    }

    /* ── Click hint ── */
    #hint {
      position: absolute;
      bottom: 34px;
      right: 24px;
      color: rgba(255,255,255,0.55);
      font-size: 12px;
      letter-spacing: 0.04em;
    }
  </style>
</head>
<body>

    <line x1="892" y1="165" x2="905" y2="178"  stroke="#ffd740" stroke-width="3.5" stroke-linecap="round"/>

    <ellipse cx="115" cy="107" rx="52"  ry="30" fill="white" opacity="0.93"/>

    <ellipse cx="160" cy="112" rx="75"  ry="22" fill="white" opacity="0.93"/>

  <polygon points="572,432 728,432 650,365" fill="none" stroke="#b71c1c" stroke-width="2"/>

  <rect x="662" y="368" width="20" height="35" fill="#a0522d"/>
  <rect x="658" y="364" width="28" height="8"  fill="#795548" rx="2"/>

  <ellipse cx="878" cy="474" rx="14" ry="11" fill="#4caf50"/>

  <!-- ═══ BUTTERFLY ═══ -->
  <g class="butterfly-body">
    <g class="butterfly-wings">
      <path d="M0,-12 Q-18,-28 -22,-8 Q-18,4 0,0 Z"  fill="#ff6f00" opacity="0.88"/>
      <path d="M0,-12 Q 18,-28  22,-8 Q 18,4 0,0 Z"  fill="#ff6f00" opacity="0.88"/>

  <!-- ═══ BIRDS ═══ -->

<div id="hint">clique para pausar / retomar</div>

<script>
  // ──────────────────────────────────────
  // LETRA — ajuste os textos se necessário
  // ──────────────────────────────────────
  const lyrics = [
    // intro
    { text: "♪ ♪ ♪", dur: 2500, chorus: false },

    // Verso 1
    { text: "Moro num lugar", dur: 3000, chorus: false },
    { text: "Numa casinha inocente do sertão", dur: 3800, chorus: false },
    { text: "Com um pé de laranja lima", dur: 3200, chorus: false },
    { text: "Um cachorrinho fiel de companhão", dur: 3800, chorus: false },
    { text: "Minha vida é muito simples", dur: 3200, chorus: false },
    { text: "Mas de graça eu não a troco não", dur: 3800, chorus: false },
    { text: "Pois eu tenho o que é mais precioso", dur: 3200, chorus: false },
    { text: "Que é saúde e um bom coração", dur: 3800, chorus: false },

    // Refrão
    { text: "♪", dur: 1800, chorus: false },
    { text: "Que vida boa, ô ô ô", dur: 3200, chorus: true },
    { text: "Que vida boa", dur: 2800, chorus: true },
    { text: "Sapo caiu na lagoa", dur: 3200, chorus: true },
    { text: "Sou eu no caminho do meu sertão", dur: 4200, chorus: true },

    { text: "Que vida boa, ô ô ô", dur: 3200, chorus: true },
    { text: "Que vida boa", dur: 2800, chorus: true },
    { text: "Sapo caiu na lagoa", dur: 3200, chorus: true },
    { text: "Sou eu no caminho do meu sertão", dur: 4200, chorus: true },

    // Verso 2
    { text: "♪", dur: 1800, chorus: false },
    { text: "Tenho o sol da madrugada", dur: 3200, chorus: false },
    { text: "Tenho o brilho da manhã", dur: 3200, chorus: false },
    { text: "Tenho a chuva que molha a terra", dur: 3200, chorus: false },
    { text: "E o arco-íris que vem lá", dur: 3500, chorus: false },
    { text: "Os pássaros cantando na varanda", dur: 3200, chorus: false },
    { text: "A borboleta que voa pelo ar", dur: 3500, chorus: false },

    // Refrão final
    { text: "♪", dur: 1800, chorus: false },
    { text: "Que vida boa, ô ô ô", dur: 3200, chorus: true },
    { text: "Que vida boa", dur: 2800, chorus: true },
    { text: "Sapo caiu na lagoa", dur: 3200, chorus: true },
    { text: "Sou eu no caminho do meu sertão", dur: 4200, chorus: true },

    { text: "Que vida boa, ô ô ô", dur: 3200, chorus: true },
    { text: "Que vida boa", dur: 2800, chorus: true },
    { text: "Sapo caiu na lagoa", dur: 3200, chorus: true },
    { text: "Sou eu no caminho do meu sertão", dur: 4800, chorus: true },

    // Fim
    { text: "🎵  Vida Boa  🎵", dur: 5000, chorus: true },
  ];

  const lineEl    = document.getElementById('lyric-line');
  const progFill  = document.getElementById('prog-fill');
  const pip       = document.getElementById('pip');

  const totalDur  = lyrics.reduce((s, l) => s + l.dur, 0);
  let idx         = 0;
  let elapsed     = 0;
  let playing     = true;
  let tid         = null;

  function show(i) {
    if (i >= lyrics.length) {
      elapsed = 0; idx = 0; show(0); return;
    }
    const item = lyrics[i];

    lineEl.classList.remove('on', 'chorus');
    lineEl.style.opacity = '0';

    setTimeout(() => {
      lineEl.textContent = item.text;
      if (item.chorus) lineEl.classList.add('chorus');
      lineEl.classList.add('on');

      tid = setTimeout(() => {
        elapsed += item.dur;
        idx++;
        updateProg();
        show(idx);
      }, item.dur);
    }, 320);
  }

  function updateProg() {
    const pct = Math.min((elapsed / totalDur) * 100, 100);
    progFill.style.width = pct + '%';
  }

  function toggle() {
    if (playing) {
      clearTimeout(tid);
      playing = false;
      pip.textContent = '▶';
    } else {
      playing = true;
      pip.textContent = '⏸';
      show(idx);
    }
    pip.classList.add('show');
    clearTimeout(pip._t);
    pip._t = setTimeout(() => pip.classList.remove('show'), 900);
  }

  document.body.addEventListener('click', toggle);

  // Start after a short intro pause
  setTimeout(() => show(0), 1200);
</script>
